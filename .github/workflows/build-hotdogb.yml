# EXPERIMENTAL / UNTESTED: skeleton for a TWRP minimal-manifest build for the OnePlus 7T (hotdogb).
# It has never been run to completion. A successful build does NOT mean the image boots.
# Nothing built here has been tested on a device. Flashing can brick your phone.
name: build-hotdogb (experimental, untested)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "minimal-manifest-twrp branch"
        default: "twrp-11"
      device_tree_branch:
        description: "Branch of the hotdogb device tree"
        default: "Android-11"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space (a TWRP tree build needs tens of GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 rsync ccache bc lz4 cpio
          mkdir -p "$HOME/bin"
          curl -sSf https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP minimal manifest
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          sudo mkdir -p /mnt/twrp && sudo chown "$USER" /mnt/twrp
          cd /mnt/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "${{ inputs.manifest_branch }}"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/hotdogb.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="victor" fetch="https://github.com/Victorious93" />
            <project name="android_device_oneplus_hotdogb_victorrecovery" path="device/oneplus/hotdogb" remote="victor" revision="${{ inputs.device_tree_branch }}" />
          </manifest>
          XML
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          df -h /mnt

      - name: Build recovery image
        run: |
          cd /mnt/twrp
          set +u
          source build/envsetup.sh
          lunch twrp_hotdogb-eng
          mka recoveryimage -j"$(nproc)"

      - name: Collect artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp /mnt/twrp/out/target/product/hotdogb/recovery.img "$GITHUB_WORKSPACE/artifact/recovery-hotdogb-EXPERIMENTAL-UNTESTED.img" || true
          cp /mnt/twrp/out/target/product/hotdogb/boot.img "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          (cd artifact && sha256sum * > SHA256SUMS.txt || true)
          printf 'EXPERIMENTAL. NOT TESTED ON A DEVICE. May brick your phone. Use fastboot boot first.\n' > artifact/WARNING.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-hotdogb-experimental-untested
          path: artifact/
          if-no-files-found: warn
